name: hadeeth
description: "الحديث المهجور - تطبيق لتعلم الأحاديث الصحيحة والسنن المهجورة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^14.6.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.0
  http: ^1.2.0
  dart_jsonwebtoken: ^2.8.0

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  share_plus: ^10.1.2
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
    - assets/images/onboarding/
    - assets/images/empty_states/
    - assets/images/character/
    - assets/images/accessories/
